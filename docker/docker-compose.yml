services:
  # Astro Backend + Relay (production)
  astro:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: astro-app
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3001
      RELAY_PORT: 3002
      REDIS_URL: redis://redis:6379
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - astro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for session management and event buffering (optional)
  redis:
    image: redis:7-alpine
    container_name: astro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - astro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Development (mounts source, runs via npm run dev)
  astro-dev:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    container_name: astro-dev
    ports:
      - "5173:5173"
      - "3001:3001"
      - "3002:3002"
    environment:
      NODE_ENV: development
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ..:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - astro-network

networks:
  astro-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
