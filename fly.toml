# Fly.io configuration for Nexus backend + relay server
# Deploy with: fly deploy

app = "nexus-backend"
primary_region = "sjc"

[build]
  builder = "heroku/builder:22"

[env]
  NODE_ENV = "production"
  RELAY_PORT = "3002"

# HTTP API server (port 3001)
[[services]]
  internal_port = 3001
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.http_checks]]
    interval = 15000
    grace_period = "10s"
    method = "get"
    path = "/api/health"
    protocol = "http"
    timeout = 5000

# WebSocket relay server (port 3002)
[[services]]
  internal_port = 3002
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3002
    handlers = ["tls"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
