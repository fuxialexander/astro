# Fly.io configuration for Astro backend + relay server
# Deploy with: fly deploy
#
# Single app exposes two services:
#   - HTTPS on 443 → Hono API (port 3001)
#   - TLS on 3002  → WebSocket relay (port 3002)

app = "astro-backend-deploy"
org = "zhuoran-yang"
primary_region = "sjc"

[build]
  dockerfile = "docker/Dockerfile"

[env]
  NODE_ENV = "production"
  RELAY_PORT = "3002"
  # IMPORTANT: Set these via `fly secrets set` for your deployment.
  # ASTRO_BASE_URL — frontend URL for device auth, emails, notifications
  # FRONTEND_URL   — CORS origin, invite links (can be same as ASTRO_BASE_URL)
  # CORS_ORIGIN    — additional CORS origin (if frontend has multiple URLs)
  # Example: fly secrets set ASTRO_BASE_URL=https://your-domain.com FRONTEND_URL=https://your-domain.com

# HTTP API server (port 3001)
[[services]]
  internal_port = 3001
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.http_checks]]
    interval = 15000
    grace_period = "30s"
    method = "get"
    path = "/api/health"
    protocol = "http"
    timeout = 10000

# WebSocket relay server (port 3002)
[[services]]
  internal_port = 3002
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3002
    handlers = ["tls"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
