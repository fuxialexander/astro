[package]
name = "astro-desktop"
version = "0.1.0"
description = "Astro Desktop - Fast filesystem and git commands via Tauri IPC"
authors = ["Astro Team"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "astro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
ignore = "0.4"
portable-pty = "0.8"
notify = "6"
notify-debouncer-mini = "0.4"
rfd = "0.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
