<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-grow Textarea Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .container {
      position: relative;
    }
    .hidden-div {
      position: absolute;
      top: 0;
      left: 0;
      visibility: hidden;
      pointer-events: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow: hidden;
    }
    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      overflow-y: auto;
      max-height: 50vh;
      min-height: 2.25em;
    }
  </style>
</head>
<body>
  <h1>Auto-grow Textarea Test</h1>
  <p>Type in the textarea below. It should grow vertically as you add more lines, up to 50% of the viewport height.</p>

  <div class="container">
    <div id="hidden" class="hidden-div" style="width: 100%"></div>
    <textarea id="textarea" rows="1" placeholder="Start typing..."></textarea>
  </div>

  <script>
    const textarea = document.getElementById('textarea');
    const hiddenDiv = document.getElementById('hidden');

    function autoResize() {
      // Copy textarea styles to hidden div
      const styles = window.getComputedStyle(textarea);
      hiddenDiv.style.font = styles.font;
      hiddenDiv.style.padding = styles.padding;
      hiddenDiv.style.border = styles.border;
      hiddenDiv.style.width = textarea.offsetWidth + 'px';

      // Copy text content with zero-width space to preserve trailing newline
      hiddenDiv.textContent = textarea.value + '\u200b';

      // Update textarea height
      textarea.style.height = hiddenDiv.scrollHeight + 'px';
    }

    textarea.addEventListener('input', autoResize);
    window.addEventListener('resize', autoResize);

    // Initial resize
    autoResize();
  </script>
</body>
</html>
