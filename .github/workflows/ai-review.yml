name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff context

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Gather PR context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get diff stats
          DIFF_STAT=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          echo "files_changed<<ENDFILES" >> "$GITHUB_OUTPUT"
          echo "$DIFF_STAT" >> "$GITHUB_OUTPUT"
          echo "ENDFILES" >> "$GITHUB_OUTPUT"

          # Get diff
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }})
          # Truncate to ~80K chars to stay within context limits
          echo "$DIFF" | head -c 80000 > /tmp/pr_diff.txt

          # Get commit messages
          COMMITS=$(gh pr view ${{ github.event.pull_request.number }} --json commits --jq '.commits[].messageHeadline')
          echo "commits<<ENDCOMMITS" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "ENDCOMMITS" >> "$GITHUB_OUTPUT"

          # Get PR body
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq '.body')
          echo "$PR_BODY" > /tmp/pr_body.txt

      - name: AI Review
        env:
          ANTHROPIC_BASE_URL: https://bedrock-runtime.${{ secrets.AWS_REGION }}.amazonaws.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLAUDE_CODE_USE_BEDROCK: "1"
        run: |
          REVIEW=$(claude -p "$(cat <<'PROMPT'
          You are a senior code reviewer for the Astro platform — a planning-first AI platform for software developers and researchers.

          ## Your Review Process

          1. **Read CLAUDE.md** at the repo root to understand the project architecture, conventions, and patterns.
          2. **Read the changed files** listed below to understand what was modified and why.
          3. **For each changed file**, also read the surrounding code (imports, callers, tests) to understand the broader context and whether the change is consistent with the codebase.
          4. **Check the workflow logic**: If the PR touches dispatch, providers, relay, or event hooks, trace the full flow to ensure correctness:
             - Dispatch: queue → provider selection → execution → result routing → PR creation
             - Relay: WebSocket message → machine registry → task routing
             - Events: hook triggers → SSE → browser
          5. **Produce a structured review** with findings categorized by severity.

          ## What to Look For

          **Critical (must fix):**
          - Security vulnerabilities (injection, XSS, credential exposure, path traversal)
          - Data loss risks (missing error handling on DB writes, silent failures)
          - Race conditions in async code
          - Breaking changes to public APIs or WebSocket protocol

          **Important (should fix):**
          - Logic errors or incorrect control flow
          - Missing error propagation (catch blocks that swallow errors)
          - Type safety issues (unsafe casts, missing null checks)
          - Missing validation at system boundaries

          **Suggestions (nice to have):**
          - Code clarity improvements
          - Performance considerations
          - Test coverage gaps

          ## What NOT to Flag

          - Style preferences (formatting, naming conventions) — trust the linter
          - Documentation gaps unless the change is a public API
          - "Could be simplified" unless the complexity actively hurts readability
          - Changes in test files unless they test the wrong thing

          ## Output Format

          Respond with a structured review. Start with a 1-2 sentence summary of the PR's purpose and approach. Then list findings grouped by severity. For each finding, include the file path, line range, and a concise explanation of the issue with a suggested fix. If the PR looks good with no issues, say so briefly.

          Example:
          ```
          ## Summary
          This PR adds JWT authentication middleware with refresh token rotation.

          ## Critical
          - **src/middleware/auth.ts:45-52**: The JWT secret is read from `process.env` on every request without caching. If the env var is unset, `jwt.verify()` receives `undefined` as the secret and silently accepts any token. → Add a startup check that throws if `JWT_SECRET` is not set.

          ## Important
          - **src/routes/auth.ts:78**: The refresh token is not invalidated after use, allowing replay attacks. → Delete the old refresh token from DB before issuing a new one.

          ## Suggestions
          - **src/lib/jwt.ts:12**: Consider using `crypto.timingSafeEqual` for token comparison to prevent timing attacks.

          ## Verdict
          🟡 Approve with changes — fix the JWT secret validation before merging.
          ```

          Use one of these verdicts:
          - 🟢 **Approve** — no issues found
          - 🟡 **Approve with changes** — non-blocking issues to address
          - 🔴 **Request changes** — critical issues that must be fixed

          PROMPT
          )

          ## PR Information

          **Title:** ${{ github.event.pull_request.title }}
          **Author:** ${{ github.event.pull_request.user.login }}
          **Base:** ${{ github.event.pull_request.base.ref }} ← **Head:** ${{ github.event.pull_request.head.ref }}

          **PR Description:**
          $(cat /tmp/pr_body.txt)

          **Commits:**
          ${{ steps.context.outputs.commits }}

          **Files changed:**
          ${{ steps.context.outputs.files_changed }}

          **Diff:**
          $(cat /tmp/pr_diff.txt)
          " --output-format text 2>&1) || true

          # Post as PR comment
          if [ -n "$REVIEW" ]; then
            # Wrap in a collapsible section for long reviews
            COMMENT="## 🤖 AI Code Review

          $REVIEW

          ---
          <sub>Reviewed by Claude (Bedrock) via [Astro CI](https://github.com/fuxialexander/astro)</sub>"

            gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
          else
            echo "Warning: AI review produced no output"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
