name: Release Electron (macOS)

# Builds and publishes the Electron desktop app for macOS. Triggered by
# pushing a `desktop-v*` tag (kept separate from the generic `v*.*.*`
# tag consumed by release.yml so the web and desktop release cycles
# don't collide) or manually via workflow_dispatch.
#
# Signing/notarization is gated on APPLE_ID / APPLE_PASSWORD /
# APPLE_TEAM_ID / APPLE_SIGNING_IDENTITY secrets — when absent the
# forge config emits an unsigned build (users will see the Gatekeeper
# warning). Wire up the secrets in Settings → Secrets and variables
# → Actions to get signed/notarized artifacts.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish under (e.g. desktop-v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w node-pty || true

      - name: Build web bundle
        run: npm run build

      - name: Build & package Electron app
        run: npm run electron:make -- --arch=universal --platform=darwin
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astro-macos-universal
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Astro Desktop ${{ steps.tag.outputs.TAG }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
