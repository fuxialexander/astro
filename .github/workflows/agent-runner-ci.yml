name: Agent Runner CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/agent-runner/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-runner/**'

concurrency:
  group: agent-runner-ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: This workflow requires the agent-runner submodule (private repo).
# It uses SSH key from AGENT_RUNNER_DEPLOY_KEY secret to access it.
# If the secret is not set, the checkout step will fail gracefully.

jobs:
  typecheck:
    name: Type Check Agent Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout agent-runner submodule
        run: |
          git submodule update --init --recursive packages/agent-runner || {
            echo "::warning::Could not checkout agent-runner submodule (private repo). Skipping."
            exit 0
          }
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"

      - name: Check submodule exists
        id: check
        run: |
          if [ -f packages/agent-runner/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Agent runner submodule not available. Skipping CI."
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: Type check agent runner
        if: steps.check.outputs.exists == 'true'
        run: npm run --prefix packages/agent-runner typecheck

  build:
    name: Build Agent Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout agent-runner submodule
        run: |
          git submodule update --init --recursive packages/agent-runner || {
            echo "::warning::Could not checkout agent-runner submodule (private repo). Skipping."
            exit 0
          }

      - name: Check submodule exists
        id: check
        run: |
          if [ -f packages/agent-runner/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: Build agent runner
        if: steps.check.outputs.exists == 'true'
        run: npm run build:agent-runner

  test:
    name: Test Agent Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout agent-runner submodule
        run: |
          git submodule update --init --recursive packages/agent-runner || {
            echo "::warning::Could not checkout agent-runner submodule (private repo). Skipping."
            exit 0
          }

      - name: Check submodule exists
        id: check
        run: |
          if [ -f packages/agent-runner/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: Run agent runner tests
        if: steps.check.outputs.exists == 'true'
        run: npm run --prefix packages/agent-runner test
        continue-on-error: true
