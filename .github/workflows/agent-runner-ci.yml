name: Agent Runner CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/agent-runner/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-runner/**'

concurrency:
  group: agent-runner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check Agent Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Type check agent runner
        run: npm run --prefix packages/agent-runner typecheck

  build:
    name: Build Agent Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build agent runner
        run: npm run build:agent-runner

  test:
    name: Test Agent Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run agent runner tests
        run: npm run --prefix packages/agent-runner test
        continue-on-error: true
